name: Build and test

on:
  workflow_dispatch:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-matrix:
    name: test (${{ matrix.framework }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        framework:
          - netcoreapp3.1
          - net5.0
          - net6.0
          - net7.0
          - net8.0
          - net9.0
          - net10.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-env

      - name: Restore
        run: dotnet restore Ling.AutoInject.slnx

      - name: Build
        run: dotnet build Ling.AutoInject.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Ling.AutoInject.SourceGenerators.Tests/Ling.AutoInject.SourceGenerators.Tests.csproj --framework ${{ matrix.framework }} --configuration Release --no-build --verbosity normal

      - name: Run sample
        if: matrix.framework == 'net10.0'
        run: dotnet run --project samples/Ling.AutoInject.Sample/Ling.AutoInject.Sample.csproj --configuration Release --no-build

      - name: Pack
        if: matrix.framework == 'net10.0'
        run: |
          dotnet pack src/Ling.AutoInject/Ling.AutoInject.csproj --configuration Release --no-build --output artifacts/packages
          dotnet pack src/Ling.AutoInject.Options/Ling.AutoInject.Options.csproj --configuration Release --no-build --output artifacts/packages

      - name: Verify packaged analyzer compatibility
        if: matrix.framework == 'net10.0'
        shell: bash
        run: |
          for spec in "6.0.428 net6.0 6.0.0" "8.0.424 net8.0 8.0.0"; do
            read -r sdk tfm di_version <<< "$spec"
            probe="$(mktemp -d)"
            pushd "$probe"
            dotnet new globaljson --sdk-version "$sdk" --roll-forward disable
            dotnet new console --framework "$tfm" --no-restore
            sed -i '/<TargetFramework>/a\    <AssemblyName>CompatProbe</AssemblyName>' *.csproj
            dotnet add package Ling.AutoInject --version 1.4.1 --source "$GITHUB_WORKSPACE/artifacts/packages"
            dotnet add package Microsoft.Extensions.DependencyInjection --version "$di_version"
            cat > Program.cs <<'EOF'
          using CompatProbe;
          using Ling.AutoInject;
          using Microsoft.Extensions.DependencyInjection;

          var services = new ServiceCollection();
          services.AddCompatProbeServices();
          using var provider = services.BuildServiceProvider();
          _ = provider.GetRequiredService<Marker>();

          [SingletonService]
          public sealed class Marker { }
          EOF
            dotnet build --no-restore -warnaserror
            dotnet run --no-build
            popd
          done

      - name: Publish and run Native AOT sample
        if: matrix.framework == 'net10.0'
        run: |
          dotnet publish samples/Ling.AutoInject.Sample/Ling.AutoInject.Sample.csproj --configuration Release --runtime linux-x64 --self-contained true -p:PublishAot=true -p:PublishTrimmed=true --output artifacts/aot-sample
          artifacts/aot-sample/Ling.AutoInject.Sample

      - name: Upload package artifact
        if: matrix.framework == 'net10.0'
        uses: actions/upload-artifact@v4
        with:
          name: Ling.AutoInject-nupkg
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  test:
    name: test
    needs: test-matrix
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify test matrix
        run: test "${{ needs.test-matrix.result }}" = "success"
