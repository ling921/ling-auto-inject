name: Publish NuGet package

on:
  release:
    types:
      - published

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-env

      - name: Restore
        run: dotnet restore Ling.AutoInject.slnx

      - name: Build
        run: dotnet build Ling.AutoInject.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Ling.AutoInject.slnx --configuration Release --no-build --verbosity normal

      - name: Run sample
        run: dotnet run --project samples/Ling.AutoInject.Sample/Ling.AutoInject.Sample.csproj --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/Ling.AutoInject/Ling.AutoInject.csproj --configuration Release --no-build --output artifacts/packages

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ling921

      - name: Publish to NuGet
        run: dotnet nuget push artifacts/packages/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
